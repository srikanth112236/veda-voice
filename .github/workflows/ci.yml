name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaadmin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: vedavoice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r api/requirements-dev.txt
          pip install -r agent/requirements.txt
          pip install -r agent/requirements-dev.txt

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy Type Checking
        run: |
          mypy api agent

      - name: Run Backend Unit & Integration Tests
        env:
          DATABASE_URL: postgresql+psycopg://vaadmin:testpassword@localhost:5432/vedavoice_test
          JWT_SECRET: test-ci-jwt-secret-minimum-32-chars-long
          INTERNAL_SIGNING_KEY: test-ci-signing-key-minimum-32-chars-long
        run: |
          pytest api/tests agent/tests -v --maxfail=5

  test-frontend:
    name: Dashboard Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        working-directory: ./dashboard
        run: npm ci

      - name: Build Next.js Dashboard
        working-directory: ./dashboard
        env:
          NEXT_PUBLIC_API_URL: https://api.placeholder.local
        run: npm run build
