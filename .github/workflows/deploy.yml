name: Deploy to Azure & LiveKit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Pre-deployment Contract & Isolation Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaadmin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: vedavoice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r api/requirements-dev.txt
          pip install -r agent/requirements.txt
          pip install -r agent/requirements-dev.txt

      - name: Run Core Test Suite
        env:
          DATABASE_URL: postgresql+psycopg://vaadmin:testpassword@localhost:5432/vedavoice_test
          JWT_SECRET: test-jwt-secret-minimum-32-chars-long
          INTERNAL_SIGNING_KEY: test-internal-hmac-key-32-bytes-minimum
        run: |
          pytest api/tests -v --maxfail=5

  deploy-staging:
    name: Deploy to Staging & Run Smoke Tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set Image Tags & Variables
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "SHA_SHORT=${SHA_SHORT}" >> $GITHUB_OUTPUT

          RG="${{ secrets.AZURE_RG_STAGING }}"
          if [ -z "$RG" ]; then
            RG="rg-vagency-staging"
          fi
          echo "AZURE_RG=${RG}" >> $GITHUB_OUTPUT

          ACR=$(az acr list --resource-group "$RG" --query "[0].name" -o tsv 2>/dev/null || echo "")
          if [ -z "$ACR" ]; then
            echo "::warning title=Staging ACR::No dedicated staging ACR found; skipping staging container deployment."
            echo "SKIP_STAGING=true" >> $GITHUB_OUTPUT
          else
            echo "SKIP_STAGING=false" >> $GITHUB_OUTPUT
            echo "ACR_NAME=${ACR}" >> $GITHUB_OUTPUT
            echo "ACR_SERVER=${ACR}.azurecr.io" >> $GITHUB_OUTPUT
          fi

      - name: Build & Push Images to ACR
        if: steps.vars.outputs.SKIP_STAGING != 'true'
        run: |
          az acr build --registry ${{ steps.vars.outputs.ACR_NAME }} --image api:${{ steps.vars.outputs.SHA_SHORT }} --image api:staging --file api/Dockerfile .
          az acr build --registry ${{ steps.vars.outputs.ACR_NAME }} --image dashboard:${{ steps.vars.outputs.SHA_SHORT }} --image dashboard:staging --file dashboard/Dockerfile .
          az acr build --registry ${{ steps.vars.outputs.ACR_NAME }} --image agent:${{ steps.vars.outputs.SHA_SHORT }} --image agent:staging --file agent/Dockerfile .

      - name: Run Database Migration Job (Alembic)
        if: steps.vars.outputs.SKIP_STAGING != 'true'
        run: |
          az containerapp job start --name db-migrate-job --resource-group ${{ steps.vars.outputs.AZURE_RG }} || echo "db-migrate-job skipped or not yet provisioned"

      - name: Update Staging Container Apps
        if: steps.vars.outputs.SKIP_STAGING != 'true'
        run: |
          ACR_SERVER="${{ steps.vars.outputs.ACR_SERVER }}"
          TAG="${{ steps.vars.outputs.SHA_SHORT }}"
          RG="${{ steps.vars.outputs.AZURE_RG }}"

          az containerapp update -n api -g "$RG" --image "${ACR_SERVER}/api:${TAG}" || az containerapp update -n api -g "$RG" --image "${ACR_SERVER}/api:staging" || true
          az containerapp update -n dashboard -g "$RG" --image "${ACR_SERVER}/dashboard:${TAG}" || az containerapp update -n dashboard -g "$RG" --image "${ACR_SERVER}/dashboard:staging" || true

      - name: Run Staging Smoke Tests
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
        if: env.STAGING_API_URL != ''
        run: |
          python -m pip install httpx pytest
          python scripts/smoke_test_prod.py --base-url "${{ env.STAGING_API_URL }}"

  deploy-production:
    name: Promote to Production
    needs: [test, deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set Production Tags
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "SHA_SHORT=${SHA_SHORT}" >> $GITHUB_OUTPUT

          RG="${{ secrets.AZURE_RG || vars.AZURE_RG }}"
          if [ -z "$RG" ]; then
            RG="rg-vagency-prod"
          fi
          echo "AZURE_RG=${RG}" >> $GITHUB_OUTPUT

          ACR=$(az acr list --resource-group "$RG" --query "[0].name" -o tsv 2>/dev/null || echo "${{ vars.ACR_NAME || 'acrvagencyprod6eac3' }}")
          if [ -z "$ACR" ]; then
            ACR="${{ vars.ACR_NAME || 'acrvagencyprod6eac3' }}"
          fi
          echo "ACR_NAME=${ACR}" >> $GITHUB_OUTPUT
          echo "ACR_SERVER=${ACR}.azurecr.io" >> $GITHUB_OUTPUT

      - name: Build & Push Production Images to ACR
        run: |
          az acr build --registry ${{ steps.vars.outputs.ACR_NAME }} --image api:${{ steps.vars.outputs.SHA_SHORT }} --image api:latest --file api/Dockerfile .
          az acr build --registry ${{ steps.vars.outputs.ACR_NAME }} --image dashboard:${{ steps.vars.outputs.SHA_SHORT }} --image dashboard:latest --file dashboard/Dockerfile .
          az acr build --registry ${{ steps.vars.outputs.ACR_NAME }} --image agent:${{ steps.vars.outputs.SHA_SHORT }} --image agent:latest --file agent/Dockerfile .

      - name: Run Production Database Migration Job (Alembic)
        run: |
          az containerapp job start --name db-migrate-job --resource-group ${{ steps.vars.outputs.AZURE_RG }} || echo "db-migrate-job skipped or not yet provisioned"

      - name: Deploy Production Revisions
        run: |
          ACR_SERVER="${{ steps.vars.outputs.ACR_SERVER }}"
          TAG="${{ steps.vars.outputs.SHA_SHORT }}"
          RG="${{ steps.vars.outputs.AZURE_RG }}"

          echo "========================================================"
          echo "--> Inspecting and Updating Container Apps across Azure..."
          echo "Target Resource Group: $RG"
          echo "ACR Server: $ACR_SERVER"
          echo "Image Tag: $TAG"

          # Query all container apps in the target RG, or fallback to subscription-wide search
          APPS_INFO=$(az containerapp list -g "$RG" --query "[].{name:name, rg:resourceGroup}" -o tsv 2>/dev/null || true)
          if [ -z "$APPS_INFO" ]; then
            echo "::warning title=No Apps in RG::Querying all Container Apps across subscription..."
            APPS_INFO=$(az containerapp list --query "[].{name:name, rg:resourceGroup}" -o tsv 2>/dev/null || true)
          fi

          echo "Discovered Container Apps:"
          echo "$APPS_INFO"

          if [ -z "$APPS_INFO" ]; then
            echo "::error title=No Container Apps Found::az containerapp list returned empty"
            exit 1
          fi

          while IFS=$'\t ' read -r APP APP_RG <&3; do
            [ -z "$APP" ] && continue
            echo "--------------------------------------------------------"
            echo "Updating Container App '$APP' in resource group '$APP_RG'..."

            IMAGE_ROLE=""
            case "$APP" in
              *dash*)
                IMAGE_ROLE="dashboard"
                ;;
              *agent*)
                IMAGE_ROLE="agent"
                ;;
              *api*)
                IMAGE_ROLE="api"
                ;;
              *)
                IMAGE_ROLE="api"
                ;;
            esac

            TARGET_IMAGE="${ACR_SERVER}/${IMAGE_ROLE}:${TAG}"
            LATEST_IMAGE="${ACR_SERVER}/${IMAGE_ROLE}:latest"
            echo "Setting image for '$APP' to $TARGET_IMAGE (fallback: $LATEST_IMAGE)..."

            az containerapp update \
              --name "$APP" \
              --resource-group "$APP_RG" \
              --image "$TARGET_IMAGE" < /dev/null || {
                echo "Warning: Update with tag $TAG failed, falling back to :latest..."
                az containerapp update \
                  --name "$APP" \
                  --resource-group "$APP_RG" \
                  --image "$LATEST_IMAGE" < /dev/null
              }
            echo "[SUCCESS] Finished revision rollout for '$APP'."
          done 3<<< "$APPS_INFO"

          # Explicit targeted update fallback for standard core apps
          for CORE_APP in api dashboard agent; do
            CORE_ROLE="$CORE_APP"
            TARGET_IMG="${ACR_SERVER}/${CORE_ROLE}:${TAG}"
            LATEST_IMG="${ACR_SERVER}/${CORE_ROLE}:latest"
            echo "Ensuring core app '$CORE_APP' in '$RG' is verified and updated..."

            if [ "$CORE_APP" = "agent" ]; then
              az containerapp update \
                --name "$CORE_APP" \
                --resource-group "$RG" \
                --image "$TARGET_IMG" \
                --min-replicas 1 \
                --max-replicas 5 \
                --set-env-vars \
                  LIVEKIT_URL="wss://steyzi-xvk89l73.livekit.cloud" \
                  LIVEKIT_API_KEY="APIUJck6jdupFvT" \
                  LIVEKIT_API_SECRET="JDwzAVyTe1j51GoaeG1kUZjfcGgRyzS52wKERIqbKTMA" \
                  API_BASE_URL="https://api.kindstone-eaab21b4.eastus2.azurecontainerapps.io" \
                  PROD_API_URL="https://api.kindstone-eaab21b4.eastus2.azurecontainerapps.io" < /dev/null || az containerapp update \
                  --name "$CORE_APP" \
                  --resource-group "$RG" \
                  --image "$LATEST_IMG" \
                  --min-replicas 1 \
                  --max-replicas 5 < /dev/null || true
            elif [ "$CORE_APP" = "api" ]; then
              az containerapp update \
                --name "$CORE_APP" \
                --resource-group "$RG" \
                --image "$TARGET_IMG" \
                --min-replicas 1 \
                --set-env-vars \
                  LIVEKIT_URL="wss://steyzi-xvk89l73.livekit.cloud" \
                  LIVEKIT_API_KEY="APIUJck6jdupFvT" \
                  LIVEKIT_API_SECRET="JDwzAVyTe1j51GoaeG1kUZjfcGgRyzS52wKERIqbKTMA" < /dev/null || az containerapp update \
                  --name "$CORE_APP" \
                  --resource-group "$RG" \
                  --image "$LATEST_IMG" \
                  --min-replicas 1 < /dev/null || true
            else
              az containerapp update \
                --name "$CORE_APP" \
                --resource-group "$RG" \
                --image "$TARGET_IMG" \
                --min-replicas 1 < /dev/null || az containerapp update \
                --name "$CORE_APP" \
                --resource-group "$RG" \
                --image "$LATEST_IMG" \
                --min-replicas 1 < /dev/null || true
            fi
          done

      - name: Deploy Voice Agent to LiveKit Cloud
        env:
          LIVEKIT_ACCESS_TOKEN: ${{ secrets.LIVEKIT_ACCESS_TOKEN }}
        if: env.LIVEKIT_ACCESS_TOKEN != ''
        run: |
          curl -sSL https://get.livekit.io/cli | bash
          cd agent
          lk cloud auth --token ${{ secrets.LIVEKIT_ACCESS_TOKEN }}
          lk agent deploy

      - name: Run Production Post-Deployment Smoke Tests
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
        if: env.PROD_API_URL != ''
        run: |
          python -m pip install httpx pytest
          python scripts/smoke_test_prod.py --base-url "${{ env.PROD_API_URL }}"
