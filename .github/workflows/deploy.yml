name: Deploy to Azure & LiveKit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy Production
    runs-on: ubuntu-latest
    if: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set Image Tags
        id: vars
        run: |
          echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "ACR_NAME=${{ secrets.ACR_NAME }}" >> $GITHUB_OUTPUT
          echo "ACR_SERVER=${{ secrets.ACR_NAME }}.azurecr.io" >> $GITHUB_OUTPUT
          echo "AZURE_RG=${{ secrets.AZURE_RG }}" >> $GITHUB_OUTPUT

      - name: Build & Push API Image to ACR
        run: |
          az acr build \
            --registry ${{ steps.vars.outputs.ACR_NAME }} \
            --image api:${{ steps.vars.outputs.SHA_SHORT }} \
            --image api:latest \
            --file api/Dockerfile .

      - name: Build & Push Dashboard Image to ACR
        run: |
          az acr build \
            --registry ${{ steps.vars.outputs.ACR_NAME }} \
            --image dashboard:${{ steps.vars.outputs.SHA_SHORT }} \
            --image dashboard:latest \
            --file dashboard/Dockerfile .

      - name: Build & Push Voice Agent Worker Image to ACR
        run: |
          az acr build \
            --registry ${{ steps.vars.outputs.ACR_NAME }} \
            --image agent:${{ steps.vars.outputs.SHA_SHORT }} \
            --image agent:latest \
            --file agent/Dockerfile .

      - name: Run Database Migration Job (Alembic)
        run: |
          echo "Triggering database migration job in Container Apps..."
          az containerapp job start \
            --name db-migrate-job \
            --resource-group ${{ steps.vars.outputs.AZURE_RG }}

      - name: "Update Container App: API"
        run: |
          az containerapp update \
            --name api \
            --resource-group ${{ steps.vars.outputs.AZURE_RG }} \
            --image ${{ steps.vars.outputs.ACR_SERVER }}/api:${{ steps.vars.outputs.SHA_SHORT }}

      - name: "Update Container App: Dashboard"
        run: |
          az containerapp update \
            --name dashboard \
            --resource-group ${{ steps.vars.outputs.AZURE_RG }} \
            --image ${{ steps.vars.outputs.ACR_SERVER }}/dashboard:${{ steps.vars.outputs.SHA_SHORT }}

      - name: "Update Container App: Dialer Worker"
        run: |
          az containerapp update \
            --name dialer \
            --resource-group ${{ steps.vars.outputs.AZURE_RG }} \
            --image ${{ steps.vars.outputs.ACR_SERVER }}/api:${{ steps.vars.outputs.SHA_SHORT }}

      - name: "Update Container App: Notifier Worker"
        run: |
          az containerapp update \
            --name notifier \
            --resource-group ${{ steps.vars.outputs.AZURE_RG }} \
            --image ${{ steps.vars.outputs.ACR_SERVER }}/api:${{ steps.vars.outputs.SHA_SHORT }}

      - name: "Update Container App: Voice Agent Worker"
        run: |
          az containerapp update \
            --name agent \
            --resource-group ${{ steps.vars.outputs.AZURE_RG }} \
            --image ${{ steps.vars.outputs.ACR_SERVER }}/agent:${{ steps.vars.outputs.SHA_SHORT }} || echo "agent container app not provisioned yet in RG"

      - name: Deploy Voice Agent to LiveKit Cloud
        if: ${{ secrets.LIVEKIT_ACCESS_TOKEN != '' }}
        env:
          LIVEKIT_ACCESS_TOKEN: ${{ secrets.LIVEKIT_ACCESS_TOKEN }}
        run: |
          curl -sSL https://get.livekit.io/cli | bash
          cd agent
          lk cloud auth --token ${{ secrets.LIVEKIT_ACCESS_TOKEN }}
          lk agent deploy

      - name: Run Production Smoke Tests
        if: ${{ secrets.PROD_API_URL != '' }}
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
        run: |
          python -m pip install httpx pytest
          python scripts/smoke_test_prod.py --base-url "${{ secrets.PROD_API_URL }}"
