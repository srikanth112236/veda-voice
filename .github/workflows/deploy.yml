name: Deploy to Azure & LiveKit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set Image Tags
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "SHA_SHORT=${SHA_SHORT}" >> $GITHUB_OUTPUT

          RG="${{ secrets.AZURE_RG }}"
          if [ -z "$RG" ]; then
            RG="rg-vagency-prod"
          fi
          echo "AZURE_RG=${RG}" >> $GITHUB_OUTPUT

          # Dynamically resolve the live ACR name from Azure to prevent secret mismatch
          ACR=$(az acr list --resource-group "$RG" --query "[0].name" -o tsv 2>/dev/null || echo "acrvagencyprod6eac3")
          if [ -z "$ACR" ]; then
            ACR="acrvagencyprod6eac3"
          fi
          echo "ACR_NAME=${ACR}" >> $GITHUB_OUTPUT
          echo "ACR_SERVER=${ACR}.azurecr.io" >> $GITHUB_OUTPUT
          echo "::notice title=Resolved ACR::Targeting Azure Registry: $ACR"

      - name: Build & Push API Image to ACR
        run: |
          az acr build \
            --registry ${{ steps.vars.outputs.ACR_NAME }} \
            --image api:${{ steps.vars.outputs.SHA_SHORT }} \
            --image api:latest \
            --file api/Dockerfile .

      - name: Build & Push Dashboard Image to ACR
        run: |
          az acr build \
            --registry ${{ steps.vars.outputs.ACR_NAME }} \
            --image dashboard:${{ steps.vars.outputs.SHA_SHORT }} \
            --image dashboard:latest \
            --file dashboard/Dockerfile .

      - name: Build & Push Voice Agent Worker Image to ACR
        run: |
          az acr build \
            --registry ${{ steps.vars.outputs.ACR_NAME }} \
            --image agent:${{ steps.vars.outputs.SHA_SHORT }} \
            --image agent:latest \
            --file agent/Dockerfile .

      - name: Run Database Migration Job (Alembic)
        run: |
          echo "Triggering database migration job in Container Apps..."
          az containerapp job start \
            --name db-migrate-job \
            --resource-group ${{ steps.vars.outputs.AZURE_RG }} || echo "db-migrate-job not provisioned or skipped"

      - name: Deploy Revisions to Running Container Apps
        run: |
          RG="${{ steps.vars.outputs.AZURE_RG }}"
          ACR="${{ steps.vars.outputs.ACR_NAME }}"
          ACR_SERVER="${{ steps.vars.outputs.ACR_SERVER }}"
          TAG="${{ steps.vars.outputs.SHA_SHORT }}"

          echo "Ensuring ACR admin credentials are enabled..."
          az acr update --name "$ACR" --resource-group "$RG" --admin-enabled true --output none || true
          ACR_USER=$(az acr credential show --name "$ACR" --query username -o tsv 2>/dev/null || echo "")
          ACR_PASS=$(az acr credential show --name "$ACR" --query "passwords[0].value" -o tsv 2>/dev/null || echo "")

          APPS=$(az containerapp list --resource-group "$RG" --query "[].name" -o tsv)
          echo "::notice title=Found Container Apps in RG::$APPS"

          for APP in $APPS; do
            echo "--------------------------------------------------------"
            echo "--> Processing Container App: $APP"

            if [ -n "$ACR_USER" ] && [ -n "$ACR_PASS" ]; then
              echo "    Setting ACR registry authentication on $APP..."
              az containerapp registry set \
                --name "$APP" \
                --resource-group "$RG" \
                --server "$ACR_SERVER" \
                --username "$ACR_USER" \
                --password "$ACR_PASS" 2>/dev/null || true
            fi

            # Match image to app role
            IMAGE_NAME=""
            case "$APP" in
              *dash*)
                IMAGE_NAME="dashboard"
                ;;
              *agent*)
                IMAGE_NAME="agent"
                ;;
              *api*)
                IMAGE_NAME="api"
                ;;
              *)
                IMAGE_NAME="api"
                ;;
            esac

            echo "    Updating $APP with image: ${ACR_SERVER}/${IMAGE_NAME}:${TAG}..."
            az containerapp update \
              --name "$APP" \
              --resource-group "$RG" \
              --image "${ACR_SERVER}/${IMAGE_NAME}:${TAG}" || {
                echo "    Warning: update with tag $TAG failed, falling back to latest..."
                az containerapp update \
                  --name "$APP" \
                  --resource-group "$RG" \
                  --image "${ACR_SERVER}/${IMAGE_NAME}:latest" || true
              }
            echo "    [DONE] Finished updating $APP."
          done

      - name: Deploy Voice Agent to LiveKit Cloud
        env:
          LIVEKIT_ACCESS_TOKEN: ${{ secrets.LIVEKIT_ACCESS_TOKEN }}
        if: env.LIVEKIT_ACCESS_TOKEN != ''
        run: |
          curl -sSL https://get.livekit.io/cli | bash
          cd agent
          lk cloud auth --token ${{ secrets.LIVEKIT_ACCESS_TOKEN }}
          lk agent deploy

      - name: Run Production Smoke Tests
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
        if: env.PROD_API_URL != ''
        run: |
          python -m pip install httpx pytest
          python scripts/smoke_test_prod.py --base-url "${{ env.PROD_API_URL }}"
